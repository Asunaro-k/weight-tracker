<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Weight Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wider">Weight Tracker</h1>
            <button onclick="openSettings()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                データ管理 / インポート
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
        
        <!-- Quick Input Card -->
        <section class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100">
            <h2 class="text-sm font-semibold text-slate-500 mb-3">本日の記録を追加</h2>
            <form id="recordForm" onsubmit="addRecord(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">日付</label>
                        <input type="date" id="inputDate" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">体重 (kg)</label>
                        <input type="number" step="0.1" id="inputWeight" placeholder="68.0" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">体脂肪率 (%) <span class="text-slate-400 font-normal">任意</span></label>
                    <input type="number" step="0.1" id="inputFat" placeholder="19.5" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm shadow-sm transition active:scale-[0.99]">
                    記録を保存する
                </button>
            </form>
        </section>

        <!-- Chart Section -->
        <section class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-semibold text-slate-500">体重推移グラフ</h2>
                <span id="latestWeightDisplay" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-md"></span>
            </div>
            <div class="relative h-64 w-full">
                <canvas id="weightChart"></canvas>
            </div>
        </section>

        <!-- History List -->
        <section class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100">
            <h2 class="text-sm font-semibold text-slate-500 mb-3">直近の記録履歴</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-100 text-xs text-slate-400">
                            <th class="pb-2 font-medium">日付</th>
                            <th class="pb-2 font-medium">体重</th>
                            <th class="pb-2 font-medium">体脂肪</th>
                            <th class="pb-2 font-medium text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y divide-slate-50">
                        <!-- JavaScriptで動的挿入 -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Data Management Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800">データ管理・バックアップ</h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 text-sm font-bold px-2 py-1">✕</button>
            </div>
            <p class="text-xs text-slate-500">データはこのブラウザ（localStorage）にのみ保存されます。機種変更時などのためにバックアップ（JSON）を保存・復元できます。</p>
            
            <div class="space-y-2">
                <button onclick="exportData()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-xl text-xs transition">
                    データをJSONファイルとしてエクスポート
                </button>
                <label class="block w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-xl text-xs text-center cursor-pointer transition">
                    JSONファイルからインポート
                    <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>

            <hr class="border-slate-100">

            <div>
                <span class="block text-xs font-bold text-slate-700 mb-1">過去データを一括で流し込む（初期インポート）</span>
                <button onclick="loadSampleData()" class="w-full bg-amber-50 hover:bg-amber-100 text-amber-800 font-medium py-2 rounded-xl text-xs transition border border-amber-200">
                    これまでの推移データ（2/15〜）をセットする
                </button>
            </div>

            <button onclick="closeSettings()" class="w-full bg-slate-900 text-white font-medium py-2.5 rounded-xl text-xs mt-2">
                閉じる
            </button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'my_weight_tracker_data';
        let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        document.getElementById('inputDate').valueAsDate = new Date();
        let weightChart = null;

        function loadSampleData() {
            if (confirm('これまでの記録データを読み込みますか？')) {
                records = [
                    { date: '2026-02-15', weight: 82.0, fat: null },
                    { date: '2026-05-16', weight: 79.7, fat: null },
                    { date: '2026-06-16', weight: 78.8, fat: null },
                    { date: '2026-06-30', weight: 76.8, fat: 28.2 },
                    { date: '2026-10-07', weight: 70.8, fat: 25.7 },
                    { date: '2026-10-20', weight: 68.5, fat: 23.6 },
                    { date: '2026-11-03', weight: 68.0, fat: 23.6 },
                    { date: '2026-11-11', weight: 68.0, fat: 19.5 }
                ];
                saveAndRefresh();
                closeSettings();
                alert('過去データを読み込みました！');
            }
        }

        function saveAndRefresh() {
            records.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            updateUI();
        }

        function addRecord(event) {
            event.preventDefault();
            const date = document.getElementById('inputDate').value;
            const weight = parseFloat(document.getElementById('inputWeight').value);
            const fatInput = document.getElementById('inputFat').value;
            const fat = fatInput ? parseFloat(fatInput) : null;

            const existingIndex = records.findIndex(r => r.date === date);
            if (existingIndex >= 0) {
                records[existingIndex] = { date, weight, fat };
            } else {
                records.push({ date, weight, fat });
            }

            saveAndRefresh();
            document.getElementById('inputWeight').value = '';
            document.getElementById('inputFat').value = '';
        }

        function deleteRecord(date) {
            if (confirm(`${date} の記録を削除しますか？`)) {
                records = records.filter(r => r.date !== date);
                saveAndRefresh();
            }
        }

        function updateUI() {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            const sortedDesc = [...records].reverse();
            sortedDesc.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-50 hover:bg-slate-50/50';
                tr.innerHTML = `
                    <td class="py-2.5 text-slate-600">${r.date}</td>
                    <td class="py-2.5 font-bold text-slate-800">${r.weight} <span class="text-xs font-normal text-slate-500">kg</span></td>
                    <td class="py-2.5 text-slate-600">${r.fat !== null ? r.fat + ' %' : '—'}</td>
                    <td class="py-2.5 text-right">
                        <button onclick="deleteRecord('${r.date}')" class="text-xs text-rose-500 hover:text-rose-700 px-2 py-1">削除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (records.length > 0) {
                const latest = records[records.length - 1];
                document.getElementById('latestWeightDisplay').innerText = `現在: ${latest.weight} kg (${latest.date})`;
            } else {
                document.getElementById('latestWeightDisplay').innerText = 'データがありません';
            }

            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('weightChart').getContext('2d');
            const labels = records.map(r => r.date);
            const dataWeights = records.map(r => r.weight);

            if (weightChart) {
                weightChart.destroy();
            }

            weightChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '体重 (kg)',
                        data: dataWeights,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.05)',
                        borderWidth: 2.5,
                        pointBackgroundColor: '#2563eb',
                        pointRadius: 4,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 6 } }
                    }
                }
            });
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `weight_data_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        records = imported;
                        saveAndRefresh();
                        closeSettings();
                        alert('データを正常にインポートしました！');
                    } else {
                        alert('無効なファイル形式です。');
                    }
                } catch (err) {
                    alert('JSONの読み込みに失敗しました。');
                }
            };
            reader.readAsText(file);
        }

        updateUI();
    </script>
</body>
</html>
